spring.application.name=afc
server.port=${PORT:8080}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/afc}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.sql.init.mode=never
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
app.jwt.secret=${JWT_SECRET:local-dev-jwt-secret-change-me-please-2026}
app.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:86400000}
app.bootstrap.admin-id=${BOOTSTRAP_ADMIN_ID:11111111-1111-1111-1111-111111111111}
app.bootstrap.admin-name=${BOOTSTRAP_ADMIN_NAME:AFC Admin}
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@afc.local}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:admin12345}
app.bootstrap.member-id=${BOOTSTRAP_MEMBER_ID:22222222-2222-2222-2222-222222222222}
app.bootstrap.member-name=${BOOTSTRAP_MEMBER_NAME:AFC Demo Member}
app.bootstrap.member-email=${BOOTSTRAP_MEMBER_EMAIL:member@afc.local}
app.bootstrap.member-password=${BOOTSTRAP_MEMBER_PASSWORD:member12345}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000,http://*:3000,https://*.vercel.app}
