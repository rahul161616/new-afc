databaseChangeLog:
  - changeSet:
      id: 007-repair-baseline-schema
      author: codex
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE TABLE IF NOT EXISTS users (
                  id UUID PRIMARY KEY,
                  name VARCHAR(100) NOT NULL,
                  phone VARCHAR(255),
                  email VARCHAR(150),
                  password_hash VARCHAR(255),
                  role VARCHAR(30) NOT NULL,
                  leader_application_status VARCHAR(30),
                  leader_application_requested_at TIMESTAMP WITH TIME ZONE,
                  leader_application_reviewed_at TIMESTAMP WITH TIME ZONE,
                  leader_application_reviewed_by UUID,
                  created_at TIMESTAMP WITH TIME ZONE NOT NULL,
                  updated_at TIMESTAMP WITH TIME ZONE NOT NULL,
                  deleted_at TIMESTAMP WITH TIME ZONE
              );

              CREATE UNIQUE INDEX IF NOT EXISTS uk_users_email ON users (email);

              CREATE TABLE IF NOT EXISTS futsal_groups (
                  id UUID PRIMARY KEY,
                  name VARCHAR(120) NOT NULL,
                  created_by UUID NOT NULL,
                  created_at TIMESTAMP WITH TIME ZONE NOT NULL,
                  updated_at TIMESTAMP WITH TIME ZONE NOT NULL,
                  deleted_at TIMESTAMP WITH TIME ZONE
              );

              CREATE TABLE IF NOT EXISTS group_members (
                  id UUID PRIMARY KEY,
                  group_id UUID NOT NULL,
                  user_id UUID NOT NULL,
                  role VARCHAR(30) NOT NULL,
                  joined_at TIMESTAMP WITH TIME ZONE NOT NULL,
                  is_active BOOLEAN NOT NULL DEFAULT false,
                  status VARCHAR(30) NOT NULL DEFAULT 'APPROVED'
              );

              CREATE UNIQUE INDEX IF NOT EXISTS uk_group_members_group_user ON group_members (group_id, user_id);

              CREATE TABLE IF NOT EXISTS venues (
                  id UUID PRIMARY KEY,
                  group_id UUID,
                  name VARCHAR(150) NOT NULL,
                  address VARCHAR(255),
                  map_url VARCHAR(255),
                  latitude DECIMAL(10,7),
                  longitude DECIMAL(10,7),
                  is_active BOOLEAN NOT NULL,
                  created_at TIMESTAMP WITH TIME ZONE NOT NULL,
                  updated_at TIMESTAMP WITH TIME ZONE NOT NULL,
                  deleted_at TIMESTAMP WITH TIME ZONE
              );

              CREATE TABLE IF NOT EXISTS futsal_events (
                  id UUID PRIMARY KEY,
                  group_id UUID NOT NULL,
                  title VARCHAR(255) NOT NULL,
                  description VARCHAR(255),
                  venue_id UUID NOT NULL,
                  start_time TIMESTAMP WITH TIME ZONE NOT NULL,
                  end_time TIMESTAMP WITH TIME ZONE NOT NULL,
                  max_players INT NOT NULL,
                  required_players INT NOT NULL,
                  status VARCHAR(255) NOT NULL,
                  created_by UUID NOT NULL,
                  created_at TIMESTAMP WITH TIME ZONE NOT NULL,
                  updated_at TIMESTAMP WITH TIME ZONE NOT NULL,
                  deleted_at TIMESTAMP WITH TIME ZONE
              );

              CREATE TABLE IF NOT EXISTS event_responses (
                  id UUID PRIMARY KEY,
                  event_id UUID NOT NULL,
                  user_id UUID NOT NULL,
                  response_status VARCHAR(30) NOT NULL,
                  note VARCHAR(255),
                  drop_reason VARCHAR(255),
                  waitlist_position INT,
                  joined_waitlist_at TIMESTAMP WITH TIME ZONE,
                  responded_at TIMESTAMP WITH TIME ZONE NOT NULL,
                  updated_at TIMESTAMP WITH TIME ZONE NOT NULL
              );

              CREATE UNIQUE INDEX IF NOT EXISTS uk_event_responses_event_user ON event_responses (event_id, user_id);

              DO $$
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'fk_group_members_group') THEN
                      ALTER TABLE group_members ADD CONSTRAINT fk_group_members_group
                          FOREIGN KEY (group_id) REFERENCES futsal_groups (id);
                  END IF;

                  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'fk_group_members_user') THEN
                      ALTER TABLE group_members ADD CONSTRAINT fk_group_members_user
                          FOREIGN KEY (user_id) REFERENCES users (id);
                  END IF;

                  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'fk_venues_group') THEN
                      ALTER TABLE venues ADD CONSTRAINT fk_venues_group
                          FOREIGN KEY (group_id) REFERENCES futsal_groups (id);
                  END IF;

                  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'fk_futsal_events_group') THEN
                      ALTER TABLE futsal_events ADD CONSTRAINT fk_futsal_events_group
                          FOREIGN KEY (group_id) REFERENCES futsal_groups (id);
                  END IF;

                  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'fk_futsal_events_venue') THEN
                      ALTER TABLE futsal_events ADD CONSTRAINT fk_futsal_events_venue
                          FOREIGN KEY (venue_id) REFERENCES venues (id);
                  END IF;

                  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'fk_futsal_events_creator') THEN
                      ALTER TABLE futsal_events ADD CONSTRAINT fk_futsal_events_creator
                          FOREIGN KEY (created_by) REFERENCES users (id);
                  END IF;

                  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'fk_event_responses_event') THEN
                      ALTER TABLE event_responses ADD CONSTRAINT fk_event_responses_event
                          FOREIGN KEY (event_id) REFERENCES futsal_events (id);
                  END IF;

                  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'fk_event_responses_user') THEN
                      ALTER TABLE event_responses ADD CONSTRAINT fk_event_responses_user
                          FOREIGN KEY (user_id) REFERENCES users (id);
                  END IF;
              END $$;
